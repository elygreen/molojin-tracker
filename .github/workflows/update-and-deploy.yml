name: Update matches & deploy

on:
  push:
    branches: [main]
  schedule:
    # Frequent runs mean most rank snapshots cover a single game (one LP-graph point each).
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch ranked solo matches
        # A failed fetch (e.g. an expired key) must not block deploying the site.
        continue-on-error: true
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: node scripts/fetch-matches.mjs

      - name: Commit updated data
        id: commit
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "No new data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update match data"
            git push
          fi

  deploy:
    needs: update
    # Scheduled runs only redeploy when new games came in.
    if: github.event_name != 'schedule' || needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/molojin-tracker/browser

      - id: deployment
        uses: actions/deploy-pages@v4
